<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Remart</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100"><header class="bg-white p-3 shadow flex justify-between sticky top-0 z-50"><h1 class="font-black text-xl">ReMart</h1><a href="/reseller" class="bg-black text-white text-xs px-3 py-1 rounded">Become Seller</a></header>
<div id="products" class="p-3 grid grid-cols-2 gap-3"></div>
<script>
const supa=supabase.createClient("https://wvazcudexrrzcfiotkan.supabase.co","sb_publishable_-clOP2Nb7AYi4xPJgVzULQ_TT4VEklP");
async function load(){let {data}=await supa.from('products').select('*').order('created_at',{ascending:false});let h='';if(!data||data.length==0)h='<p class="col-span-2 text-center text-gray-400 mt-10">No products yet. Reseller se add karo.</p>';data?.forEach(p=>{h+=`<div class="bg-white rounded-xl shadow overflow-hidden"><img src="${p.image}" class="h-40 w-full object-cover"><div class="p-2"><h3 class="font-bold text-sm">${p.title}</h3><p class="text-xs">₹${p.final_price} <span class="text-green-600">${p.commission} profit</span></p><button onclick="buy('${p.reseller_whatsapp}','${p.title}',${p.final_price})" class="w-full mt-2 bg-black text-white text-xs py-2 rounded">Buy Now</button></div></div>`});document.getElementById('products').innerHTML=h;}
function buy(wa,title,price){let fee=Math.round(price*0.05);let msg=`New Order on ReMart%0AProduct: ${title}%0APrice: ₹${price}%0APlatform Fee (5%): ₹${fee} aapko dena hai%0ACustomer Details bhejo`;window.open(`https://wa.me/${wa}?text=${msg}`,'_blank');}
load();
</script></body></html>
