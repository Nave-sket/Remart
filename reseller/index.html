<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Reseller - ReMart</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-4">
<div class="max-w-md mx-auto space-y-4">
  <div class="bg-black text-white p-4 rounded-xl flex justify-between">
    <div><p class="text-xs opacity-70">Wallet Balance</p><h1 id="wallet" class="text-2xl font-bold">₹0</h1></div>
    <button onclick="addMoney()" class="bg-white text-black px-4 py-2 rounded-full text-sm font-bold">+ Add Money</button>
  </div>
  <div class="bg-white p-4 rounded-xl shadow">
    <h2 class="font-bold">Add New Product</h2>
    <input id="pname" placeholder="Product Name" class="w-full border p-2 mt-2 rounded">
    <div class="flex gap-2 mt-2">
      <input id="cost" type="number" placeholder="Original Cost (e.g. 300)" class="w-1/2 border p-2 rounded">
      <input id="sell" type="number" placeholder="Selling Price (e.g. 500)" class="w-1/2 border p-2 rounded">
    </div>
    <p class="text-xs mt-2 text-gray-500">Profit: <span id="profit">0</span> | Tera 70% | Admin 30%</p>
    <button onclick="addProduct()" class="w-full bg-black text-white p-2 rounded mt-3">List Product</button>
  </div>
  <div class="bg-white p-4 rounded-xl shadow"><h2 class="font-bold">My Orders</h2><p class="text-sm text-gray-500 mt-2">COD ke liye wallet me paisa hona zaruri hai.</p></div>
</div>
<script>
  let wallet = parseInt(localStorage.getItem('wallet')||'0');
  document.getElementById('wallet').innerText = '₹'+wallet;
  document.getElementById('cost').oninput = document.getElementById('sell').oninput = ()=>{
    let c=parseInt(document.getElementById('cost').value||0); let s=parseInt(document.getElementById('sell').value||0);
    document.getElementById('profit').innerText = '₹'+(s-c);
  }
  function addMoney(){
    let amt = prompt("Kitna add karna hai? (e.g. 500)");
    if(!amt) return;
    let upi = "8368322869@ybl";
    let link = `upi://pay?pa=${upi}&pn=ReMart Admin&am=${amt}&cu=INR&tn=Wallet Recharge`;
    window.location.href = link;
    alert("Payment ke baad admin approve karega, fir wallet me paisa aayega. Screenshot admin ko bhej do.");
    // Demo ke liye turant add kar diya
    wallet += parseInt(amt);
    localStorage.setItem('wallet', wallet);
    document.getElementById('wallet').innerText = '₹'+wallet;
  }
  function addProduct(){ alert("Product Listed! Jab order ayega, 30% admin fee wallet se katega."); }
</script>
</body>
</html>
