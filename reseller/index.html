 <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reseller Pro</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-[#f8f8f8] p-3">
<div class="bg-black text-white p-4 rounded-xl flex justify-between items-center"><div><p class="text-xs text-gray-400">Wallet Balance</p><h1 id="wallet" class="text-2xl font-black">₹0</h1><p id="phoneShow" class="text-[10px] text-gray-400"></p></div><button onclick="document.getElementById('addBox').classList.toggle('hidden')" class="bg-white text-black px-4 py-2 rounded-full text-sm font-bold">+ Add Money</button></div>
<div id="addBox" class="hidden bg-white p-4 rounded-xl mt-3 border-2 border-[#f43397]"><h3 class="font-bold text-sm">Add Money - UPI: 8368322869@ybl</h3><div class="flex gap-2 mt-2"><input id="addAmt" type="number" placeholder="Amount" class="border p-2 rounded flex-1 text-sm"><button onclick="payUPI()" class="bg-[#f43397] text-white px-4 rounded font-bold">Pay</button></div><div class="flex gap-2 mt-2"><input id="utr" placeholder="UTR 12 digit" class="border p-2 rounded flex-1 text-sm"><button onclick="verifyPayment()" class="bg-black text-white px-4 rounded">Verify</button></div></div>
<div class="bg-white p-4 rounded-xl mt-3"><h3 class="font-bold">Withdraw</h3><div class="flex gap-2 mt-2"><input id="withAmt" type="number" placeholder="Min 100" class="border p-2 rounded flex-1 text-sm"><button onclick="withdraw()" class="bg-black text-white px-4 rounded font-bold">Withdraw</button></div></div>
<div class="bg-white p-4 rounded-xl mt-3"><h3 class="font-bold">Add New Product - Bina Link Ke List Hoga</h3><input id="pName" placeholder="Product Name" class="w-full border p-2.5 rounded-lg mt-3 text-sm"><div class="flex gap-2 mt-2"><input id="pCost" type="number" placeholder="Original Cost" class="border p-2 rounded flex-1 text-sm"><input id="pSell" type="number" placeholder="Selling Price" class="border p-2 rounded flex-1 text-sm"></div><p id="profitText" class="text-xs mt-2 text-gray-500">Profit: 0 | Tera 70% | Admin 30%</p><input id="pImg" placeholder="Image URL - https://..." class="w-full border p-2 rounded mt-2 text-sm"><button onclick="listProduct()" class="w-full bg-black text-white p-3 rounded-lg mt-3 font-bold">List Product - Main Site Pe Dikhega</button></div>
<script>
const client = supabase.createClient("https://wvazcudexrrzcfiotkan.supabase.co", "sb_publishable_-clOP2Nb7AYi4xPJgVzULQ_TT4VEklP");
let myPhone = localStorage.getItem('res_phone') || prompt("Apna Phone Daalo - Ye Tera Reseller ID Banega"); if(myPhone){ localStorage.setItem('res_phone', myPhone); document.getElementById('phoneShow').innerText="ID: "+myPhone; }
document.getElementById('pCost').addEventListener('input', calc); document.getElementById('pSell').addEventListener('input', calc);
function calc(){ let c=parseInt(document.getElementById('pCost').value)||0, s=parseInt(document.getElementById('pSell').value)||0, p=s-c; document.getElementById('profitText').innerText=`Profit: ₹${p} | Tera 70%: ₹${Math.round(p*0.7)} | Admin 30%: ₹${Math.round(p*0.3)}`; }
async function loadWallet(){ if(!myPhone) return; let {data}=await client.from('resellers').select('*').eq('phone', myPhone).single(); if(data) document.getElementById('wallet').innerText='₹'+data.wallet; }
function payUPI(){ let amt=document.getElementById('addAmt').value; if(!amt) return alert("Amount bharo"); window.location.href=`upi://pay?pa=8368322869@ybl&pn=ReMart&am=${amt}&cu=INR&tn=Wallet ${myPhone}`; }
async function verifyPayment(){ let amt=parseInt(document.getElementById('addAmt').value), utr=document.getElementById('utr').value; if(!amt||utr.length<6) return alert("Amount + UTR bharo"); let {data}=await client.from('resellers').select('*').eq('phone', myPhone).single(); if(data){ await client.from('resellers').update({wallet:data.wallet+amt}).eq('phone', myPhone); } else { await client.from('resellers').insert([{phone:myPhone, wallet:amt}]); } await client.from('wallet_requests').insert([{phone:myPhone, amount:amt, utr:utr, status:'PAID'}]); alert("Wallet me add ho gaya - Ab product list kar sakta hai"); loadWallet(); }
async function withdraw(){ let amt=parseInt(document.getElementById('withAmt').value); if(amt<100) return alert("Min 100"); let {data}=await client.from('resellers').select('*').eq('phone', myPhone).single(); if(!data||data.wallet<amt) return alert("Balance kam hai"); await client.from('resellers').update({wallet:data.wallet-amt}).eq('phone', myPhone); await client.from('withdraw_requests').insert([{phone:myPhone, amount:amt, status:'PENDING'}]); alert("Withdraw request admin ko gaya - 24h me ayega 8368322869@ybl se"); loadWallet(); }
async function listProduct(){ let name=document.getElementById('pName').value, cost=parseInt(document.getElementById('pCost').value), sell=parseInt(document.getElementById('pSell').value), img=document.getElementById('pImg').value||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"; if(!name||!cost||!sell) return alert("Sab bharo"); let {error}=await client.from('products').insert([{name:name, original_cost:cost, selling_price:sell, image:img, reseller_phone:myPhone, profit:sell-cost}]); if(error) return alert(error.message); alert("Product List Ho Gaya! Ab remart2.vercel.app pe dikhega"); document.getElementById('pName').value=''; }
loadWallet();
</script></body></html>
