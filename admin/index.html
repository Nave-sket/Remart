<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-gray-100 p-4"><h1 class="font-black text-xl">ReMart Admin - Live Orders</h1><div id="list" class="mt-4 space-y-3"></div>
<script>
const client = supabase.createClient("https://wvazcudexrrzcfiotkan.supabase.co", "sb_publishable_-clOP2Nb7AYi4xPJgVzULQ_TT4VEklP");
async function load(){ const {data} = await client.from('orders').select('*').order('created_at',{ascending:false}); document.getElementById('list').innerHTML = data.map(o=>`<div class="bg-white p-3 rounded-xl"><p class="font-bold">${o.customer_name} - ${o.phone}</p><p class="text-xs">${o.address}</p><p class="text-sm mt-1">Total: ₹${o.total} | Fee (30%): ₹${o.platform_fee} | ${o.payment_mode}</p><p class="text-xs text-gray-400">${new Date(o.created_at).toLocaleString()}</p></div>`).join('') || 'No orders'; }
load(); setInterval(load,3000);
</script></body></html>
