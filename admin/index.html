<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100">
<div id="login" class="flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
    <h1 class="text-2xl font-bold">Admin Login</h1><p class="text-gray-500 text-sm mb-6">PIN: 1234</p>
    <input id="pin" type="tel" inputmode="numeric" placeholder="1234" class="w-full border-2 p-3 rounded-lg mb-4 text-lg">
    <button id="btn" class="w-full bg-black text-white p-3 rounded-lg font-bold text-lg">Login</button>
    <p id="err" class="text-red-500 text-sm mt-3 hidden">Galat PIN hai bhai! 1234 daal</p>
  </div>
</div>
<div id="dashboard" class="hidden"><header class="bg-black text-white p-4 flex justify-between"><h1 class="font-bold">ReMart Admin</h1><button onclick="localStorage.clear();location.reload()" class="text-sm bg-white text-black px-3 py-1 rounded">Logout</button></header>
<div class="p-4 grid grid-cols-2 gap-4"><div class="bg-white p-4 rounded-xl shadow"><p class="text-xs text-gray-500">Orders</p><h2 class="text-2xl font-bold">2</h2></div><div class="bg-white p-4 rounded-xl shadow"><p class="text-xs text-gray-500">Commission</p><h2 class="text-2xl font-bold text-green-600">₹168</h2></div></div>
<div class="p-4"><div class="bg-white rounded-xl shadow p-4"><h3 class="font-bold">Orders (Demo)</h3><p class="text-sm mt-2">Kurta ₹499 +₹74 (₹49+5%)<br>Saree ₹899 +₹94</p><p class="text-xs text-gray-400 mt-4">Supabase connect ke baad yaha real orders ayenge.</p></div></div></div>
<script>
document.getElementById('btn').addEventListener('click', function(){
  var p = document.getElementById('pin').value.trim();
  console.log('PIN:', p);
  if(p === '1234'){ document.getElementById('login').classList.add('hidden'); document.getElementById('dashboard').classList.remove('hidden'); localStorage.setItem('admin','1'); }
  else{ document.getElementById('err').classList.remove('hidden'); alert('PIN 1234 hai, tune '+p+' dala hai'); }
});
if(localStorage.getItem('admin')==='1'){ document.getElementById('login').classList.add('hidden'); document.getElementById('dashboard').classList.remove('hidden'); }
</script></body></html>
