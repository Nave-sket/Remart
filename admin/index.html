<!DOCTYPE html>
<html lang="en">
<head>

<title>ReMart Admin</title>

<body class="bg-gray-100 min-h-screen">

    <input id="pin" type="password" placeholder="Enter PIN" class="w-full border p-3 rounded-lg mb-4">

    <p id="err" class="text-red-500 text-sm mt-3 hidden">Galat PIN!</p>
  </div>
</div>
