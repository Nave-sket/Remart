<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - ReMart</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="login" class="flex items-center justify-center min-h-screen p-4"><div class="bg-white p-8 rounded-xl shadow w-full max-w-sm"><h1 class="font-bold text-xl">Admin Login</h1><input id="pin" placeholder="PIN" class="w-full border p-3 rounded mt-4"><button onclick="if(document.getElementById('pin').value=='1234'){localStorage.setItem('admin','yes');location.reload()}else{alert('Wrong PIN')}" class="w-full bg-black text-white p-3 rounded mt-3">Login</button></div></div>
<div id="dash" class="hidden">
<header class="bg-black text-white p-4 flex justify-between"><h1 class="font-bold">ReMart Admin</h1><button onclick="localStorage.clear();location.reload()" class="text-xs bg-white text-black px-3 py-1 rounded">Logout</button></header>
<div class="p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
<div class="bg-white p-5 rounded-xl shadow"><p class="text-xs text-gray-500">Total Commission (₹49+5%)</p><h2 id="totalComm" class="text-2xl font-bold">₹0</h2><p class="text-xs text-gray-400 mt-1">UPI: 8368322869@ybl</p><button onclick="withdraw()" class="mt-3 w-full bg-green-600 text-white p-2 rounded font-bold">Withdraw to UPI</button></div>
<div class="bg-white p-5 rounded-xl shadow"><p class="text-xs text-gray-500">Your UPI ID</p><input id="upi" value="8368322869@ybl" class="w-full border p-2 rounded mt-2 text-sm"><button onclick="localStorage.setItem('adminUPI',document.getElementById('upi').value);alert('UPI Saved!')" class="mt-2 w-full bg-black text-white p-2 rounded text-sm">Save UPI</button></div>
<div class="bg-white p-5 rounded-xl shadow"><p class="text-xs text-gray-500">Total Products</p><h2 id="totalProd" class="text-2xl font-bold">0</h2></div>
</div>
<div class="p-4"><div class="bg-white p-4 rounded-xl shadow"><h3 class="font-bold mb-3">Recent Products</h3><div id="prodList" class="text-sm"></div></div></div>
</div>
<script>
const supabaseUrl='https://YOUR_SUPABASE_URL.supabase.co'; const supabaseKey='YOUR_ANON_KEY'; const supabase=window.supabase.createClient(supabaseUrl, supabaseKey);
if(localStorage.getItem('admin')){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');load()}
async function load(){let {data}=await supabase.from('products').select('*');document.getElementById('totalProd').innerText=data.length;let total=0;data.forEach(p=>{total+=49+Math.round(p.base_price*0.05)});document.getElementById('totalComm').innerText='₹'+total;document.getElementById('prodList').innerHTML=data.map(p=>`<div class='border-b py-2 flex justify-between'><span>${p.title} - ₹${p.base_price}</span><span class='text-green-600'>+₹${49+Math.round(p.base_price*0.05)}</span></div>`).join('')}
function withdraw(){let amt=document.getElementById('totalComm').innerText;let upi=document.getElementById('upi').value;if(amt=='₹0'){alert('Abhi koi commission nahi hai');return}alert(`Withdraw Request: ${amt} aapke UPI ${upi} pe bheja jayega! (Resellers ko pay karne ko bolo)`);window.open(`upi://pay?pa=${upi}&am=${amt.replace('₹','')}&cu=INR`)}
</script>
</body>
</html>
